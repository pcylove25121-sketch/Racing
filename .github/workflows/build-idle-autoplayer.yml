name: Build 방치형 오토 APK

on:
  push:
    paths:
      - "idle-autoplayer/**"
      - ".github/workflows/build-idle-autoplayer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idle-autoplayer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 러너에는 Android SDK 가 기본 설치되어 있어요 (ANDROID_HOME 설정됨).
      # 부족한 플랫폼/빌드툴은 AGP 가 빌드 중 자동으로 내려받아요.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idle-autoplayer-debug-apk
          path: idle-autoplayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
