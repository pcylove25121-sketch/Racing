name: Build 방치형 오토 APK

on:
  push:
    paths:
      - "idle-autoplayer/**"
      - ".github/workflows/build-idle-autoplayer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idle-autoplayer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idle-autoplayer-debug-apk
          path: idle-autoplayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
